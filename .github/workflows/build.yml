name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            artifact: dsh-share-mac
          # Pin to windows-2022: the windows-latest runner now ships Visual
          # Studio 18, which the bundled node-gyp (9.x) doesn't recognize when
          # rebuilding node-pty. windows-2022 has VS 2022 (17), which it does.
          - os: windows-2022
            command: npm run dist:win
            artifact: dsh-share-win
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: dsh-share-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-pty (a native module pulled in by @deepseek-ai/dsh) is rebuilt for
      # Electron during packaging. node-gyp needs Python with `distutils`
      # (removed in Python 3.12) and, on Windows, the MSVC toolchain.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & compile
        run: npm run build

      - name: Generate app icon
        run: node scripts/generate-icon.js

      - name: Build (${{ matrix.os }})
        # Unset the signing/notarization env vars when their secrets are
        # absent. An empty CSC_LINK makes electron-builder try to import a
        # certificate from the empty path (which resolves to the repo root and
        # fails with "not a file"), so we must not pass it through as "".
        shell: bash
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK
          [ -z "$CSC_KEY_PASSWORD" ] && unset CSC_KEY_PASSWORD
          [ -z "$APPLE_ID" ] && unset APPLE_ID
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && unset APPLE_APP_SPECIFIC_PASSWORD
          [ -z "$APPLE_TEAM_ID" ] && unset APPLE_TEAM_ID
          ${{ matrix.command }}
        env:
          # macOS + Windows code signing (optional). When these secrets are
          # absent, electron-builder produces unsigned builds.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization (optional).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
